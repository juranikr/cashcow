name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
      - run: npm ci
      - run: python -m pip install -r runtime/requirements.txt -r browser_worker/requirements.txt
      - run: python -m py_compile runtime/main.py runtime/engine.py runtime/storage.py runtime/world.py runtime/browser_client.py runtime/browser_planner.py runtime/cognition.py
      - run: python -m py_compile browser_worker/main.py browser_worker/policy.py browser_worker/egress.py
      - run: python -m unittest discover -s runtime -p 'test_*.py' -v
      - run: python -m unittest discover -s browser_worker -p 'test_*.py' -v
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate -no-color
      - run: docker build --build-arg "RUNTIME_BUILD_SHA=$GITHUB_SHA" -f runtime/Dockerfile -t "cashcow-runtime:$GITHUB_SHA" runtime
      - run: docker build --build-arg "BROWSER_WORKER_BUILD_SHA=$GITHUB_SHA" -f browser_worker/Dockerfile -t "cashcow-browser-worker:$GITHUB_SHA" browser_worker
      - run: bash dev/container-smoke.sh "$GITHUB_SHA"
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
