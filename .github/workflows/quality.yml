name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python -m py_compile runtime/main.py runtime/engine.py runtime/storage.py runtime/world.py
      - run: python -m unittest discover -s runtime -p 'test_*.py' -v
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
